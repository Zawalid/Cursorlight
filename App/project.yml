name: Beacon
options:
  bundleIdPrefix: app.beacon
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
packages:
  Beacon:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.6"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
targets:
  Beacon:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Beacon
        product: BeaconCore
    entitlements:
      path: Sources/Beacon.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Beacon
        CFBundleDisplayName: Beacon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.6"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beacon.mac
