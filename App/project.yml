name: Cursorlight
options:
  bundleIdPrefix: app.cursorlight
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
packages:
  Cursorlight:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.6"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
targets:
  Cursorlight:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Cursorlight
        product: CursorlightCore
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Sources/Cursorlight.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Cursorlight
        CFBundleDisplayName: Cursorlight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: app.cursorlight.mac
            CFBundleURLSchemes:
              - cursorlight
        LSMinimumSystemVersion: "14.6"
        SUFeedURL: https://github.com/Zawalid/Cursorlight/releases/latest/download/appcast.xml
        # Public half of the EdDSA key from generate_keys. While it starts with REPLACE the updater never starts.
        SUPublicEDKey: grATakqncDgT+qYEVBzOk7SodjxcynJWWtIAv76zclM=
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cursorlight.mac
        # One signed binary: a separate debug dylib signed differently from the app fails to load under hardened runtime.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
